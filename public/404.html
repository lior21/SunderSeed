<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Page Not Found | SunderSeed</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 0%, #0d1b2a 0%, #060b13 70%);
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 1.5rem;
      }
      .box { max-width: 32rem; text-align: center; }
      .code {
        font-size: 4rem;
        font-weight: 800;
        margin: 0;
        background: linear-gradient(to right, #22d3ee, #38bdf8, #3b82f6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: -0.03em;
      }
      h1 { font-size: 1.35rem; font-weight: 700; margin: 0.5rem 0 0.75rem; }
      p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin: 0 0 1.75rem; }
      a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border-radius: 9999px;
        background: rgba(34, 211, 238, 0.12);
        border: 1px solid rgba(34, 211, 238, 0.35);
        color: #67e8f9;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: rgba(34, 211, 238, 0.2); }
    </style>
  </head>
  <body>
    <div class="box">
      <p class="code">404</p>
      <h1>This page does not exist</h1>
      <p>
        The address you requested was not found on SunderSeed. The tool itself lives on a
        single page — head back to the homepage to split or recover a seed phrase.
      </p>
      <a href="/">Go to SunderSeed</a>
    </div>
  </body>
</html>
