name: Deploy Single HTML App to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Calculate Release Version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          custom_release_types: "major:Major,minor:Minor,patch:Patch"
          create_annotated_tag: false

      - name: Build Single HTML App
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          APP_VERSION: ${{ steps.tag_version.outputs.new_version }}

      - name: Verify Secrets Availability
        run: |
          HAS_TOKEN=0
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "✓ CLOUDFLARE_API_TOKEN is available"; HAS_TOKEN=1; fi
          if [ -n "${{ secrets.CF_API_TOKEN }}" ]; then echo "✓ CF_API_TOKEN is available"; HAS_TOKEN=1; fi
          if [ $HAS_TOKEN -eq 0 ]; then
            echo "::error::Neither CLOUDFLARE_API_TOKEN nor CF_API_TOKEN is accessible by this GitHub Action job."
            echo "If your secrets were created inside an Environment (like 'github-pages'), move them to 'Repository secrets' or specify the environment in the job."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          projectName: 'wordcrux-slip39'
          directory: 'dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

