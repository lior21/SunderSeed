name: Deploy Single HTML App to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Read-only by default; the write permissions this workflow needs are granted
# per job below (see the OpenSSF Scorecard Token-Permissions check).
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # github-tag-action pushes the version tag
      deployments: write   # wrangler-action records the Pages deployment
      id-token: write      # attest-build-provenance signs the attestation
      attestations: write  # attest-build-provenance stores the attestation
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Calculate Release Version
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b  # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          custom_release_types: "major:Major,minor:Minor,patch:Patch"
          create_annotated_tag: false

      - name: Build Single HTML App
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          APP_VERSION: ${{ steps.tag_version.outputs.new_version }}

      - name: Record build SHA-256
        run: |
          SHA256=$(sha256sum dist/index.html | awk '{print $1}')
          echo "dist/index.html SHA-256: $SHA256"
          {
            echo "### Build Artifact Checksum"
            echo "- \`dist/index.html\` SHA-256: \`$SHA256\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-path: 'dist/index.html'

      - name: Verify Secrets Availability
        run: |
          HAS_TOKEN=0
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "✓ CLOUDFLARE_API_TOKEN is available"; HAS_TOKEN=1; fi
          if [ -n "${{ secrets.CF_API_TOKEN }}" ]; then echo "✓ CF_API_TOKEN is available"; HAS_TOKEN=1; fi
          if [ $HAS_TOKEN -eq 0 ]; then
            echo "::error::Neither CLOUDFLARE_API_TOKEN nor CF_API_TOKEN is accessible by this GitHub Action job."
            echo "If your secrets were created inside an Environment (like 'github-pages'), move them to 'Repository secrets' or specify the environment in the job."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sunderseed --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

