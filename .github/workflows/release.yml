name: Build and Release Single HTML App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Manual Version Bump Type'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Calculate Semantic Version Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ github.event.inputs.bump_type != 'auto' && github.event.inputs.bump_type || 'patch' }}
          custom_release_types: "major:Major,minor:Minor,patch:Patch"

      - name: Update package.json Version
        run: |
          NEW_VER="${{ steps.tag_version.outputs.new_version }}"
          if [ -n "$NEW_VER" ]; then
            npm version "$NEW_VER" --no-git-tag-version
          fi

      - name: Build Single HTML App
        run: npm run build

      - name: Commit package.json Version Update
        if: ${{ steps.tag_version.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump package.json to ${{ steps.tag_version.outputs.new_version }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed or nothing to push"

      - name: Create Release and Upload HTML Asset
        uses: softprops/action-gh-release@v2
        if: ${{ steps.tag_version.outputs.new_tag }}
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: dist/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
