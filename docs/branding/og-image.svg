<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="SunderSeed">
  <!-- Open Graph / social preview card (1200x630).
       Rendered to public/og-image.png. Uses the same tile + wordmark
       treatment as lockup-dark.svg, on a soft branded background. -->
  <defs>
    <linearGradient id="ogTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4" />
      <stop offset="0.5" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="ogWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5f3fc" />
      <stop offset="0.55" stop-color="#bae6fd" />
      <stop offset="1" stop-color="#bfdbfe" />
    </linearGradient>

    <radialGradient id="ogGlowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.16" />
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ogGlowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.14" />
      <stop offset="1" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ogCenter" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1424" />
      <stop offset="1" stop-color="#060b13" />
    </radialGradient>

    <pattern id="ogGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 0 H48 M0 0 V48" stroke="#94a3b8" stroke-opacity="0.045" stroke-width="1" />
    </pattern>

    <radialGradient id="ogGridFade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="ogGridMask">
      <rect width="1200" height="630" fill="url(#ogGridFade)" />
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogCenter)" />
  <ellipse cx="430" cy="315" rx="340" ry="220" fill="url(#ogGlowCyan)" />
  <ellipse cx="790" cy="320" rx="360" ry="240" fill="url(#ogGlowBlue)" />
  <rect width="1200" height="630" fill="url(#ogGrid)" mask="url(#ogGridMask)" />

  <!-- Lockup: icon tile + wordmark (vertically centered in WhatsApp 630x630 safe zone) -->
  <!-- Safe zone: x from 285 to 915 (630px wide), y from 0 to 630, centered at y=315 in 1200x630 image -->
  <!-- Icon positioned in upper part of safe zone, text in lower part, pair vertically centered at y=315 -->
  <!-- Icon group origin at y=150, rect spans y=150-318, center at y=234 -->
  <!-- Text at y=396, center at y=396, vertical midpoint with icon at y=315 -->
  <g transform="translate(516 160)">
    <rect width="168" height="168" rx="42" fill="url(#ogTile)" />
    <g transform="translate(82 84) scale(2.1) translate(-31 -31.5)">
      <path d="M28 5 L18 22 L12 40 L16 52 L28 58 L38 56 L46 44 L50 28 L40 10 L34 6 Z" fill="#ffffff" />
    </g>
  </g>
  <!-- Text: "SunderSeed" vertically centered with icon in safe zone (pair midpoint at y=315) -->
  <text x="600" y="426" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2.2" fill="url(#ogWord)" text-anchor="middle">SunderSeed</text>
</svg>